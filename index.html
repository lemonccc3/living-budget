<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7edef"><link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="不要再亂花了"><title>不要再亂花了</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;color:#5a474d;background:#f7edef}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:18px 16px 80px}.card{background:#fff;border:1px solid #eadadd;border-radius:22px;padding:18px;margin-bottom:14px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.muted{color:#927b82;font-size:13px}.big{font-size:34px;font-weight:750}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.stat,.daily{background:#f8e9ed;border-radius:15px;padding:12px}.daily{text-align:center;margin-top:14px}.daily strong{font-size:28px}button{border:0;border-radius:14px;padding:12px;font-size:15px;background:#ead4da;color:#5a474d}.primary{background:#5a474d;color:#fff;width:100%;margin-top:12px}input{width:100%;font-size:16px;padding:12px;border:1px solid #e4d4d8;border-radius:12px;margin-top:6px}label{font-size:13px;color:#816d73;display:block;margin-top:10px}.forms{display:grid;gap:14px}.cal-head{display:flex;justify-content:space-between;align-items:center}.week,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.week{font-size:12px;color:#927b82;margin:14px 0 6px}.day{min-height:58px;border-radius:12px;padding:7px 2px;background:transparent}.day.sel{background:#ead4da}.day.today{outline:1px solid #d8b9c1}.dots{font-size:10px}.record{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid #efe1e4}.record .info{flex:1}.tag{font-size:11px;background:#f5e6ea;border-radius:20px;padding:3px 7px}h1{font-size:18px;margin:0}h2{font-size:17px;margin:0 0 12px}.empty{font-size:13px;color:#927b82}.income{color:#5f8a72}.expense{color:#b76e79}.incomeTag{background:#e7f1eb;color:#527561}.expenseTag{background:#f7e7e9;color:#9b5f68}.danger{color:#b76e79}.toolbar{display:flex;gap:8px}@media(min-width:600px){.forms{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(4,1fr)}}</style></head><body><main><section class="card"><div class="row"><div><div id="monthLabel" class="muted"></div><div><span id="available" class="big">$0</span> <span class="muted">真正可用</span></div></div><button id="setBudget">設定預算</button></div><div class="stats"><div class="stat"><div class="muted">月生活費</div><strong id="budget">$0</strong></div><div class="stat"><div class="muted">收入</div><strong id="income" class="income">$0</strong></div><div class="stat"><div class="muted">已支出</div><strong id="spent" class="expense">$0</strong></div><div class="stat"><div class="muted">預計支出</div><strong id="planned">$0</strong></div><div class="stat"><div class="muted">剩餘天數</div><strong id="days">0 天</strong></div></div><div class="daily"><div class="muted">從今天到月底，平均每天可以花</div><strong id="daily">$0</strong></div></section><section class="card"><div class="cal-head"><button id="prev">‹</button><div><h1 id="calTitle"></h1><div class="muted">點日期查看當天紀錄</div></div><button id="next">›</button></div><div class="week"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div><div id="calendar" class="calendar"></div><div id="dayDetail"></div></section><div class="forms"><form id="incomeForm" class="card"><h2 class="income">＋ 記一筆收入</h2><label>項目<input id="iName" required placeholder="例如：打工薪水"></label><label>金額<input id="iAmount" required type="number" min="1" inputmode="numeric"></label><label>日期<input id="iDate" required type="date"></label><button class="primary">加入收入</button></form><form id="expenseForm" class="card"><h2>＋ 記一筆支出</h2><label>項目<input id="eName" required placeholder="例如：晚餐"></label><label>金額<input id="eAmount" required type="number" min="1" inputmode="numeric"></label><label>日期<input id="eDate" required type="date"></label><button class="primary">加入支出</button></form><form id="planForm" class="card"><h2>📌 預先紀錄支出</h2><label>項目<input id="pName" required placeholder="例如：手機費"></label><label>金額<input id="pAmount" required type="number" min="1" inputmode="numeric"></label><label>日期<input id="pDate" required type="date"></label><button class="primary">加入預計支出</button></form></div><section class="card"><div class="row"><h2>全部紀錄</h2><div class="toolbar"><button id="exportBtn" type="button">備份</button><button id="importBtn" type="button">匯入</button><input id="importFile" type="file" accept="application/json" hidden></div></div><div id="records"></div></section></main><script>
const STORE='living-budget-v1',now=new Date(),pad=n=>String(n).padStart(2,'0'),dk=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d),today=dk(now.getFullYear(),now.getMonth(),now.getDate()),money=n=>'$'+Math.round(Number(n)||0).toLocaleString('zh-TW');let state=load(),viewY=now.getFullYear(),viewM=now.getMonth(),selected=today;function load(){try{let s=JSON.parse(localStorage.getItem(STORE));if(s&&s.budgets&&s.expenses&&s.planned){s.incomes=Array.isArray(s.incomes)?s.incomes:[];return s}}catch(e){}return{defaultBudget:12000,budgets:{},incomes:[],expenses:[],planned:[]}}function save(){localStorage.setItem(STORE,JSON.stringify(state))}function mk(y,m){return y+'-'+pad(m+1)}function bf(y,m){return Number(state.budgets[mk(y,m)]??state.defaultBudget??0)}function mi(a,y,m){let p=mk(y,m)+'-';return a.filter(x=>x.date.startsWith(p))}function sum(a){return a.reduce((s,x)=>s+Number(x.amount),0)}function esc(s){let d=document.createElement('div');d.textContent=s;return d.innerHTML}function summary(){let y=now.getFullYear(),m=now.getMonth(),b=bf(y,m),inc=sum(mi(state.incomes,y,m)),sp=sum(mi(state.expenses,y,m)),pl=sum(mi(state.planned,y,m)),av=b+inc-sp-pl,last=new Date(y,m+1,0).getDate(),ds=Math.max(1,last-now.getDate()+1);monthLabel.textContent=(m+1)+' 月生活費';budget.textContent=money(b);income.textContent=money(inc);spent.textContent=money(sp);planned.textContent=money(pl);available.textContent=money(av);available.classList.toggle('danger',av<0);days.textContent=ds+' 天';daily.textContent=money(Math.max(0,av/ds))}function cal(){calTitle.textContent=viewY+' 年 '+(viewM+1)+' 月';calendar.innerHTML='';let f=new Date(viewY,viewM,1).getDay(),l=new Date(viewY,viewM+1,0).getDate();for(let i=0;i<f;i++)calendar.append(document.createElement('div'));for(let d=1;d<=l;d++){let k=dk(viewY,viewM,d),inc=state.incomes.some(x=>x.date===k),ex=state.expenses.some(x=>x.date===k),pl=state.planned.some(x=>x.date===k),b=document.createElement('button');b.className='day'+(k===selected?' sel':'')+(k===today?' today':'');b.innerHTML='<div>'+d+'</div><div class="dots">'+(inc?'<span class="income">●</span> ':'')+(ex?'<span class="expense">●</span>':'')+(pl?' ○':'')+'</div>';b.onclick=()=>{selected=k;cal()};calendar.append(b)}day()}function day(){let xs=[...state.incomes.filter(x=>x.date===selected).map(x=>({...x,t:'收入',kind:'i'})),...state.expenses.filter(x=>x.date===selected).map(x=>({...x,t:'已支出',kind:'e'})),...state.planned.filter(x=>x.date===selected).map(x=>({...x,t:'預計',kind:'p'}))];dayDetail.innerHTML='<div class="muted">'+selected+'</div>'+(xs.length?xs.map(x=>'<div class="record"><div class="info">'+esc(x.name)+' <span class="tag '+(x.kind==='i'?'incomeTag':'expenseTag')+'">'+x.t+'</span></div><strong class="'+(x.kind==='i'?'income':'expense')+'">'+(x.kind==='i'?'+':'−')+money(x.amount)+'</strong></div>').join(''):'<p class="empty">這天還沒有紀錄。</p>')}function rec(){let xs=[...state.incomes.map(x=>({...x,t:'i'})),...state.expenses.map(x=>({...x,t:'e'})),...state.planned.map(x=>({...x,t:'p'}))].sort((a,b)=>b.date.localeCompare(a.date));records.innerHTML=xs.length?'':'<p class="empty">目前還沒有紀錄。</p>';xs.forEach(x=>{let d=document.createElement('div');d.className='record';d.innerHTML='<div class="info"><strong>'+esc(x.name)+'</strong><div class="muted">'+x.date+' · '+(x.t==='i'?'收入':x.t==='p'?'預計支出':'已支出')+'</div></div><strong class="'+(x.t==='i'?'income':'expense')+'">'+(x.t==='i'?'+':'−')+money(x.amount)+'</strong>';if(x.t==='p'){let p=document.createElement('button');p.textContent='已付款';p.onclick=()=>{state.planned=state.planned.filter(i=>i.id!==x.id);state.expenses.push({...x,t:undefined,date:today});save();render()};d.append(p)}let del=document.createElement('button');del.textContent='刪除';del.onclick=()=>{if(!confirm('確定刪除這筆紀錄嗎？'))return;let a=x.t==='i'?'incomes':x.t==='p'?'planned':'expenses';state[a]=state[a].filter(i=>i.id!==x.id);save();render()};d.append(del);records.append(d)})}function render(){summary();cal();rec()}function add(f,t){let p=t==='i'?'i':t==='e'?'e':'p',name=document.getElementById(p+'Name').value.trim(),amount=Number(document.getElementById(p+'Amount').value),date=document.getElementById(p+'Date').value;if(!name||amount<=0||!date)return;state[t==='i'?'incomes':t==='e'?'expenses':'planned'].push({id:Date.now()+Math.random().toString(16),name,amount,date});save();f.reset();document.getElementById(p+'Date').value=today;selected=date;let q=date.split('-').map(Number);viewY=q[0];viewM=q[1]-1;render()}incomeForm.onsubmit=e=>{e.preventDefault();add(e.currentTarget,'i')};expenseForm.onsubmit=e=>{e.preventDefault();add(e.currentTarget,'e')};planForm.onsubmit=e=>{e.preventDefault();add(e.currentTarget,'p')};iDate.value=eDate.value=pDate.value=today;setBudget.onclick=()=>{let y=now.getFullYear(),m=now.getMonth(),v=prompt('設定 '+(m+1)+' 月生活費',bf(y,m));if(v===null)return;let n=Number(v);if(!Number.isFinite(n)||n<0)return alert('請輸入正確金額');state.budgets[mk(y,m)]=n;state.defaultBudget=n;save();render()};prev.onclick=()=>{if(--viewM<0){viewM=11;viewY--}selected=dk(viewY,viewM,1);cal()};next.onclick=()=>{if(++viewM>11){viewM=0;viewY++}selected=dk(viewY,viewM,1);cal()};exportBtn.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='不要再亂花了備份-'+today+'.json';a.click()};importBtn.onclick=()=>importFile.click();importFile.onchange=async()=>{try{let s=JSON.parse(await importFile.files[0].text());if(!s.budgets||!Array.isArray(s.expenses)||!Array.isArray(s.planned))throw 0;s.incomes=Array.isArray(s.incomes)?s.incomes:[];state=s;save();render();alert('匯入完成')}catch(e){alert('備份檔無法讀取')}};render();</script></body></html>
