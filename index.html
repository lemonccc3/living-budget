<section class="card" id="overview"><div class="row"><div><div id="monthLabel" class="muted"></div><div><span id="available" class="big">$0</span> <span class="muted">真正可用</span></div></div><div class="toolbar"><button id="refreshApp" type="button" title="重整" aria-label="重整">↻</button><button id="setBudget">設定預算</button></div></div><div class="stats"><div class="stat"><div class="muted">月生活費</div><strong id="budget">$0</strong></div><div class="stat"><div class="muted">剩餘天數</div><strong id="days">0 天</strong></div><div class="stat"><div class="muted">收入</div><strong id="income" class="income">$0</strong></div><div class="stat"><div class="muted">預計收入</div><strong id="plannedIncome" class="income">$0</strong></div><div class="stat"><div class="muted">支出</div><strong id="spent" class="expense">$0</strong></div><div class="stat"><div class="muted">預計支出</div><strong id="planned" class="expense">$0</strong></div></div><div class="daily"><div class="muted daily-label"><svg class="castle-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#9b7432" d="M3 21V9h3V5h3v4h6V5h3v4h3v12H3Z"/><path fill="#fff5dc" d="M5 11h2v2H5zm4 0h2v2H9zm4 0h2v2h-2zm4 0h2v2h-2zM10 16h4v5h-4z"/><path fill="#d9bd78" d="M2 21h20v2H2zM4 7h2v2H4zm12 0h2v2h-2z"/></svg><span>從今天到月底，平均每天可以花</span></div><strong id="daily">$0</strong></div></section><section class="card" id="calendar-panel"><div class="cal-head"><button id="prev">‹</button><div><h1 id="calTitle"></h1><div class="muted">點日期查看當天紀錄</div></div><button id="next">›</button></div><div class="week"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div><div id="calendar" class="calendar"></div><div id="dayDetail"></div></section><div class="forms" id="entry-panel"><form id="incomeForm" class="card"><h2 class="income">＋ 記一筆收入</h2><label>項目<input id="iName" required placeholder="例如：打工薪水"></label><label>金額<input id="iAmount" required type="number" min="1" inputmode="numeric"></label><div class="muted" style="margin-top:10px">日期固定為今天：<span id="incomeToday"></span></div><button class="primary">加入收入</button></form><form id="planIncomeForm" class="card"><h2 class="income">📅 預先紀錄收入</h2><label>項目<input id="piName" required placeholder="例如：預計薪水"></label><label>金額方式<div class="planType"><button type="button" data-pit="exact" class="active">確定金額</button><button type="button" data-pit="estimate">預估金額</button><button type="button" data-pit="range">金額範圍</button></div></label><div id="piSingleAmount"><label><span id="piAmountLabel">金額</span><input id="piAmount" type="number" min="1" inputmode="numeric"></label></div><div id="piRangeAmount" class="rangeRow" hidden><label>最低金額<input id="piMin" type="number" min="1" inputmode="numeric"></label><label>最高金額<input id="piMax" type="number" min="1" inputmode="numeric"></label></div><label>預計日期<input id="piDate" required type="date"></label><button class="primary">加入預計收入</button></form><form id="expenseForm" class="card"><h2>＋ 記一筆支出</h2><label>項目<input id="eName" required placeholder="例如：晚餐"></label><label>金額<input id="eAmount" required type="number" min="1" inputmode="numeric"></label><div class="muted" style="margin-top:10px">日期固定為今天：<span id="expenseToday"></span></div><button class="primary">加入支出</button></form><form id="planForm" class="card"><h2>📌 預先紀錄支出</h2><label>項目<input id="pName" required placeholder="例如：手機費"></label><label>金額方式<div class="planType"><button type="button" data-pt="exact" class="active">確定金額</button><button type="button" data-pt="estimate">預估金額</button><button type="button" data-pt="range">金額範圍</button></div></label><div id="singleAmount"><label><span id="amountLabel">金額</span><input id="pAmount" type="number" min="1" inputmode="numeric"></label></div><div id="rangeAmount" class="rangeRow" hidden><label>最低金額<input id="pMin" type="number" min="1" inputmode="numeric"></label><label>最高金額<input id="pMax" type="number" min="1" inputmode="numeric"></label></div><label>預計日期<input id="pDate" required type="date"></label><button class="primary">加入預計支出</button></form></div><section class="card" id="records-panel"><div class="row"><h2>全部紀錄</h2><div class="toolbar"><button id="exportBtn" type="button">備份</button><button id="importBtn" type="button">匯入</button><input id="importFile" type="file" accept="application/json" hidden></div></div><div id="records"></div></section></main><script>
const STORE='living-budget-v1',now=new Date(),pad=n=>String(n).padStart(2,'0'),dk=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d),today=dk(now.getFullYear(),now.getMonth(),now.getDate()),money=n=>'$'+Math.round(Number(n)||0).toLocaleString('zh-TW');
let state=load(),viewY=now.getFullYear(),viewM=now.getMonth(),selected=today,planType='exact',planIncomeType='exact';
function load(){try{let s=JSON.parse(localStorage.getItem(STORE));if(s&&s.budgets&&s.expenses&&s.planned){s.incomes=Array.isArray(s.incomes)?s.incomes:[];s.plannedIncomes=(Array.isArray(s.plannedIncomes)?s.plannedIncomes:[]).map(x=>({...x,amountType:x.amountType||'exact'}));s.planned=s.planned.map(x=>({...x,amountType:x.amountType||'exact'}));return s}}catch(e){}return{defaultBudget:12000,budgets:{},incomes:[],plannedIncomes:[],expenses:[],planned:[]}}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function mk(y,m){return y+'-'+pad(m+1)}
function bf(y,m){return Number(state.budgets[mk(y,m)]??state.defaultBudget??0)}
function mi(a,y,m){let p=mk(y,m)+'-';return a.filter(x=>x.date.startsWith(p))}
function sum(a){return a.reduce((s,x)=>s+Number(x.amount),0)}
function esc(s){let d=document.createElement('div');d.textContent=s;return d.innerHTML}
function summary(){let y=viewY,m=viewM,b=bf(y,m),inc=sum(mi(state.incomes,y,m)),sp=sum(mi(state.expenses,y,m)),pl=sum(mi(state.planned,y,m)),pinc=sum(mi(state.plannedIncomes,y,m)),av=b+inc-sp-pl,last=new Date(y,m+1,0).getDate(),isCurrent=y===now.getFullYear()&&m===now.getMonth(),isFuture=y>now.getFullYear()||(y===now.getFullYear()&&m>now.getMonth()),ds=isCurrent?Math.max(1,last-now.getDate()+1):isFuture?last:0;monthLabel.textContent=y+' 年 '+(m+1)+' 月概況';budget.textContent=money(b);income.textContent=money(inc);plannedIncome.textContent=money(pinc);spent.textContent=money(sp);planned.textContent=money(pl);available.textContent=money(av);available.classList.toggle('danger',av<0);days.textContent=isFuture?last+' 天':isCurrent?ds+' 天':'已結束';document.querySelector('.daily .muted').textContent=isFuture?'這個月平均每天可以花':isCurrent?'從今天到月底，平均每天可以花':'此月份最終平均每日可用';daily.textContent=money(Math.max(0,av/(ds||last)))}
function cal(){calTitle.textContent=viewY+' 年 '+(viewM+1)+' 月';calendar.innerHTML='';let f=new Date(viewY,viewM,1).getDay(),l=new Date(viewY,viewM+1,0).getDate();for(let i=0;i<f;i++)calendar.append(document.createElement('div'));for(let d=1;d<=l;d++){let k=dk(viewY,viewM,d),inc=state.incomes.some(x=>x.date===k),ex=state.expenses.some(x=>x.date===k),pl=state.planned.some(x=>x.date===k),pi=state.plannedIncomes.some(x=>x.date===k),b=document.createElement('button');b.className='day'+(k===selected?' sel':'')+(k===today?' today':'');b.innerHTML='<div>'+d+'</div><div class="dots">'+(inc?'<span class="income">●</span> ':'')+(ex?'<span class="expense">●</span>':'')+(pl?' ○':'')+(pi?' <span class="income">○</span>':'')+'</div>';b.onclick=()=>{selected=k;cal()};calendar.append(b)}day()}
function amountText(x){return x.amountType==='range'&&x.minAmount?'約 '+money(x.minAmount)+'～'+money(x.amount):x.amountType==='estimate'?'約 '+money(x.amount):money(x.amount)}
function day(){let xs=[...state.incomes.filter(x=>x.date===selected).map(x=>({...x,t:'收入',kind:'i'})),...state.plannedIncomes.filter(x=>x.date===selected).map(x=>({...x,t:'預計收入',kind:'pi'})),...state.expenses.filter(x=>x.date===selected).map(x=>({...x,t:'已支出',kind:'e'})),...state.planned.filter(x=>x.date===selected).map(x=>({...x,t:'預計',kind:'p'}))];dayDetail.innerHTML='<div class="muted">'+selected+'</div>'+(xs.length?xs.map(x=>'<div class="record"><div class="info">'+esc(x.name)+' <span class="tag '+(x.kind==='i'||x.kind==='pi'?'incomeTag':'expenseTag')+'">'+x.t+'</span></div><strong class="'+(x.kind==='i'||x.kind==='pi'?'income':'expense')+'">'+(x.kind==='i'||x.kind==='pi'?'+':'−')+(x.kind==='p'||x.kind==='pi'?amountText(x):money(x.amount))+'</strong></div>').join(''):'<p class="empty">這天還沒有紀錄。</p>')}
function finishPlan(x){let actual=prompt('實際支付金額是多少？',x.amount);if(actual===null)return;actual=Number(actual);if(!Number.isFinite(actual)||actual<0)return alert('請輸入正確金額');state.planned=state.planned.filter(i=>i.id!==x.id);state.expenses.push({id:x.id,name:x.name,amount:actual,date:today});save();render()}
function finishPlannedIncome(x){let actual=prompt('實際收到的金額是多少？',x.amount);if(actual===null)return;actual=Number(actual);if(!Number.isFinite(actual)||actual<0)return alert('請輸入正確金額');state.plannedIncomes=state.plannedIncomes.filter(i=>i.id!==x.id);state.incomes.push({id:x.id,name:x.name,amount:actual,date:today});save();render()}
function editPlannedIncome(x){if(x.amountType==='range'){let lo=prompt('最低預估金額',x.minAmount||x.amount),hi=lo===null?null:prompt('最高預估金額',x.amount);if(lo===null||hi===null)return;lo=Number(lo);hi=Number(hi);if(lo<=0||hi<lo)return alert('請輸入正確範圍');x.minAmount=lo;x.amount=hi}else{let v=prompt(x.amountType==='estimate'?'調整預估金額':'調整金額',x.amount);if(v===null)return;v=Number(v);if(v<=0)return alert('請輸入正確金額');x.amount=v}save();render()}
function editPlan(x){if(x.amountType==='range'){let lo=prompt('最低預估金額',x.minAmount||x.amount),hi=lo===null?null:prompt('最高預估金額（會以最高金額保留預算）',x.amount);if(lo===null||hi===null)return;lo=Number(lo);hi=Number(hi);if(lo<=0||hi<lo)return alert('請輸入正確範圍');x.minAmount=lo;x.amount=hi}else{let v=prompt(x.amountType==='estimate'?'調整預估金額':'調整金額',x.amount);if(v===null)return;v=Number(v);if(v<=0)return alert('請輸入正確金額');x.amount=v}save();render()}
function rec(){let xs=[...state.incomes.map(x=>({...x,t:'i'})),...state.plannedIncomes.map(x=>({...x,t:'pi'})),...state.expenses.map(x=>({...x,t:'e'})),...state.planned.map(x=>({...x,t:'p'}))].sort((a,b)=>b.date.localeCompare(a.date)),groups={};xs.forEach(x=>(groups[x.date.slice(0,7)]??=[]).push(x));records.innerHTML='';if(!xs.length){records.innerHTML='<p class="empty">目前還沒有紀錄。</p>';return}Object.keys(groups).sort().reverse().forEach(key=>{let det=document.createElement('details');det.className='monthGroup';det.open=key===mk(viewY,viewM);let sm=document.createElement('summary');let [yy,mm]=key.split('-');sm.textContent=yy+' 年 '+Number(mm)+' 月（'+groups[key].length+' 筆）';det.append(sm);groups[key].forEach(x=>{let d=document.createElement('div');d.className='record';if(x.t==='p'||x.t==='pi'){let ck=document.createElement('button');ck.className='check';ck.title='標記已付款';ck.textContent='○';ck.onclick=()=>x.t==='pi'?finishPlannedIncome(x):finishPlan(x);d.append(ck)}d.insertAdjacentHTML('beforeend','<div class="info"><strong>'+esc(x.name)+'</strong><div class="muted">'+x.date+' · '+(x.t==='i'?'收入':x.t==='pi'?'預計收入':x.t==='p'?'待付款':'已支出')+((x.t==='p'||x.t==='pi')&&x.amountType==='estimate'?' · 預估':(x.t==='p'||x.t==='pi')&&x.amountType==='range'?' · 範圍':'')+'</div></div><strong class="'+(x.t==='i'||x.t==='pi'?'income':'expense')+'">'+(x.t==='i'||x.t==='pi'?'+':'−')+(x.t==='p'||x.t==='pi'?amountText(x):money(x.amount))+'</strong>');if(x.t==='p'||x.t==='pi'){let ed=document.createElement('button');ed.className='editBtn';ed.textContent='調整';ed.onclick=()=>x.t==='pi'?editPlannedIncome(x):editPlan(x);d.append(ed)}let del=document.createElement('button');del.textContent='刪除';del.onclick=()=>{if(!confirm('確定刪除這筆紀錄嗎？'))return;let a=x.t==='i'?'incomes':x.t==='pi'?'plannedIncomes':x.t==='p'?'planned':'expenses';state[a]=state[a].filter(i=>i.id!==x.id);save();render()};d.append(del);det.append(d)});records.append(det)})}
function render(){summary();cal();rec()}
function addBasic(f,t){let p=t==='i'?'i':'e',name=document.getElementById(p+'Name').value.trim(),amount=Number(document.getElementById(p+'Amount').value),date=today;if(!name||amount<=0||!date)return;state[t==='i'?'incomes':'expenses'].push({id:Date.now()+Math.random().toString(16),name,amount,date});save();f.reset();selected=date;let q=date.split('-').map(Number);viewY=q[0];viewM=q[1]-1;render()}
incomeForm.onsubmit=e=>{e.preventDefault();addBasic(e.currentTarget,'i')};expenseForm.onsubmit=e=>{e.preventDefault();addBasic(e.currentTarget,'e')};
document.querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>{planType=b.dataset.pt;document.querySelectorAll('[data-pt]').forEach(z=>z.classList.toggle('active',z===b));singleAmount.hidden=planType==='range';rangeAmount.hidden=planType!=='range';amountLabel.textContent=planType==='estimate'?'預估金額':'金額'});

planIncomeForm.onsubmit=e=>{e.preventDefault();let name=piName.value.trim(),date=piDate.value,obj={id:Date.now()+Math.random().toString(16),name,date,amountType:planIncomeType};if(planIncomeType==='range'){let lo=Number(piMin.value),hi=Number(piMax.value);if(!name||!date||lo<=0||hi<lo)return alert('請輸入正確的金額範圍');obj.minAmount=lo;obj.amount=hi}else{let a=Number(piAmount.value);if(!name||!date||a<=0)return alert('請輸入正確金額');obj.amount=a}state.plannedIncomes.push(obj);save();planIncomeForm.reset();planIncomeType='exact';document.querySelectorAll('[data-pit]').forEach(b=>b.classList.toggle('active',b.dataset.pit==='exact'));piSingleAmount.hidden=false;piRangeAmount.hidden=true;piAmountLabel.textContent='金額';piDate.value=today;selected=date;let q=date.split('-').map(Number);viewY=q[0];viewM=q[1]-1;render()};
planForm.onsubmit=e=>{e.preventDefault();let name=pName.value.trim(),date=pDate.value,obj={id:Date.now()+Math.random().toString(16),name,date,amountType:planType};if(planType==='range'){let lo=Number(pMin.value),hi=Number(pMax.value);if(!name||!date||lo<=0||hi<lo)return alert('請輸入正確的金額範圍');obj.minAmount=lo;obj.amount=hi}else{let a=Number(pAmount.value);if(!name||!date||a<=0)return alert('請輸入正確金額');obj.amount=a}state.planned.push(obj);save();planForm.reset();planType='exact';document.querySelectorAll('[data-pt]').forEach(b=>b.classList.toggle('active',b.dataset.pt==='exact'));singleAmount.hidden=false;rangeAmount.hidden=true;amountLabel.textContent='金額';pDate.value=today;selected=date;let q=date.split('-').map(Number);viewY=q[0];viewM=q[1]-1;render()};

const bunnyQuotes=[

];
let bunnyQuoteDeck=[],lastBunnyQuote=-1;
function drawBunnyQuote(){
  if(!bunnyQuoteDeck.length){
    bunnyQuoteDeck=Array.from({length:bunnyQuotes.length},(_,i)=>i);
    for(let i=bunnyQuoteDeck.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [bunnyQuoteDeck[i],bunnyQuoteDeck[j]]=[bunnyQuoteDeck[j],bunnyQuoteDeck[i]];
    }
    if(bunnyQuoteDeck.length>1&&bunnyQuoteDeck[0]===lastBunnyQuote){
      [bunnyQuoteDeck[0],bunnyQuoteDeck[1]]=[bunnyQuoteDeck[1],bunnyQuoteDeck[0]];
    }
  }
  lastBunnyQuote=bunnyQuoteDeck.shift();
  return bunnyQuotes[lastBunnyQuote];
}
function petBunny(){
  bunnyDialog.hidden=false;
  bunnyTap.setAttribute('aria-expanded','true');
  const q=drawBunnyQuote();
  bunnyMessage.replaceChildren();
  const author=document.createElement('div');
  author.className='quote-author';
  author.textContent=q.author;
  const original=document.createElement('div');
  original.className='quote-original';
  original.textContent='「'+q.quote+'」';
  bunnyMessage.append(author,original);
  if(q.translation){
    const translation=document.createElement('div');
    translation.className='quote-translation';
    translation.textContent=q.translation.replace(/^(翻譯|白話)：?\\s*/, '');
    bunnyMessage.append(translation);
  }
}
bunnyTap.onclick=petBunny;
bunnyClose.onclick=()=>{bunnyDialog.hidden=true;bunnyTap.setAttribute('aria-expanded','false');};
setBudget.onclick=()=>{let y=viewY,m=viewM,v=prompt('設定 '+y+' 年 '+(m+1)+' 月生活費',bf(y,m));if(v===null)return;let n=Number(v);if(!Number.isFinite(n)||n<0)return alert('請輸入正確金額');state.budgets[mk(y,m)]=n;if(y===now.getFullYear()&&m===now.getMonth())state.defaultBudget=n;save();render()};
prev.onclick=()=>{if(--viewM<0){viewM=11;viewY--}selected=dk(viewY,viewM,1);render()};next.onclick=()=>{if(++viewM>11){viewM=0;viewY++}selected=dk(viewY,viewM,1);render()};
exportBtn.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='不要再亂花了備份-'+today+'.json';a.click()};
importBtn.onclick=()=>importFile.click();importFile.onchange=async()=>{try{let s=JSON.parse(await importFile.files[0].text());if(!s.budgets||!Array.isArray(s.expenses)||!Array.isArray(s.planned))throw 0;s.incomes=Array.isArray(s.incomes)?s.incomes:[];s.plannedIncomes=(Array.isArray(s.plannedIncomes)?s.plannedIncomes:[]).map(x=>({...x,amountType:x.amountType||'exact'}));state=s;save();render();alert('匯入完成')}catch(e){alert('備份檔無法讀取')}};
render();
